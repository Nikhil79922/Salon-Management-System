services:

  # =========================
  # POSTGRES
  # =========================

  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gasmonkey

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    networks:
      - gasmonkeynik

  # =========================
  # EUREKA SERVER
  # =========================

  eurekaserver:
    image: "gasmonkeynik/salon-eureka:v1"
    container_name: eurekaserver

    ports:
      - "8070:8070"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: eureka-server

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8070/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 600m

    networks:
      - gasmonkeynik


  # =========================
  # API GATEWAY
  # =========================

  gateway-service:
    image: "gasmonkeynik/salon-gateway:v1"
    container_name: gateway-service

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: gateway-service

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

    depends_on:
      eurekaserver:
        condition: service_healthy

      keycloak:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 600m

    networks:
      - gasmonkeynik


  # =========================
  # USER SERVICE
  # =========================

  user-service:
    image: "gasmonkeynik/salon-user:v1"
    container_name: user-service

    ports:
      - "5001:5001"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: users-service

      KEYCLOAK_CLIENT_UUID: ${KEYCLOAK_CLIENT_UUID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5001/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      eurekaserver:
        condition: service_healthy

      postgres:
        condition: service_healthy

      keycloak:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 700m

    networks:
      - gasmonkeynik


  # =========================
  # SALON SERVICE
  # =========================

  salon-service:
    image: "gasmonkeynik/salon-salon:v1"
    container_name: salon-service

    ports:
      - "5002:5002"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: salon-service

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5002/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      eurekaserver:
        condition: service_healthy

      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 700m

    networks:
      - gasmonkeynik


  # =========================
  # CATEGORY SERVICE
  # =========================

  category-service:
    image: "gasmonkeynik/salon-category:v1"
    container_name: category-service

    ports:
      - "5003:5003"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: category-service

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5003/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      eurekaserver:
        condition: service_healthy

      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 600m

    networks:
      - gasmonkeynik


  # =========================
  # SERVICE OFFERING
  # =========================

  service-offering-service:
    image: "gasmonkeynik/salon-servicesoffering:v1"
    container_name: service-offering-service

    ports:
      - "5004:5004"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: service-offering-service

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5004/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      eurekaserver:
        condition: service_healthy

      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 600m

    networks:
      - gasmonkeynik


  # =========================
  # BOOKING SERVICE
  # =========================

  booking-service:
    image: "gasmonkeynik/salon-booking:v1"
    container_name: booking-service

    ports:
      - "5005:5005"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: booking-service

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5005/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      eurekaserver:
        condition: service_healthy

      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 600m

    networks:
      - gasmonkeynik


  # =========================
  # PAYMENT SERVICE
  # =========================

  payment-service:
    image: "gasmonkeynik/salon-payment:v1"
    container_name: payment-service

    ports:
      - "5006:5006"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: payment-service

      RAZORPAY_API_KEY: ${RAZORPAY_API_KEY}
      RAZORPAY_API_SECRET: ${RAZORPAY_API_SECRET}

      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_API_SECRET: ${STRIPE_API_SECRET}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5006/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      eurekaserver:
        condition: service_healthy

      postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 700m

    networks:
      - gasmonkeynik


# =========================
# VOLUMES
# =========================

volumes:
  postgres_data:


# =========================
# NETWORK
# =========================

networks:
  gasmonkeynik:
    driver: bridge