      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5004/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    container_name: service-offering-service
    environment:
      SPRING_APPLICATION_NAME: "service-offering-service"
    depends_on:
      gateway-service:
        condition: service_healthy
    deploy:
      resources:
